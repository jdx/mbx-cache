name: release-plz

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release:
    name: Release
    if: github.repository == 'jdx/mise-cache'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag: ${{ steps.mise-cache-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: Find the mise-cache tag
        id: mise-cache-tag
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          tag=""
          if [ -n "$RELEASES" ]; then
            tag=$(jq -r '[.[] | select(.package_name == "mise-cache")][0].tag // ""' <<<"$RELEASES")
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "mise-cache tag: ${tag:-<none released>}"

  image:
    name: Publish container image
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      contents: write
      id-token: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release.outputs.tag }}

  publish-release:
    name: Publish GitHub release
    needs: [release, image]
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false

  release-pr:
    name: Release PR
    if: github.repository == 'jdx/mise-cache'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
