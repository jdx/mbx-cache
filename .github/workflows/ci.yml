name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.9
      - run: terraform -chdir=deploy/hetzner/terraform fmt -check -recursive
      - run: terraform -chdir=deploy/hetzner/terraform init -backend=false
      - run: terraform -chdir=deploy/hetzner/terraform validate
      - run: pipx install ansible-core==2.21.2
      - run: ansible-playbook --syntax-check -i '127.0.0.1,' deploy/hetzner/ansible/playbook.yml
      - run: shellcheck deploy/hetzner/deploy.sh
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: "rustfmt, clippy"
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
