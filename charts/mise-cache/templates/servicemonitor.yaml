{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-mise-cache
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: mise-cache, app.kubernetes.io/instance: {{ .Release.Name }}}
  endpoints: [{port: http, path: /metrics}]
{{- end }}
