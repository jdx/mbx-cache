---
- name: Configure mise-cache
  hosts: all
  become: true
  vars:
    deploy_dir: /opt/mise-cache
    cache_domain: "{{ lookup('env', 'MISE_CACHE_DOMAIN') }}"
    cache_image: "{{ lookup('env', 'MISE_CACHE_IMAGE') }}"
    database_password: "{{ lookup('env', 'MISE_CACHE_DATABASE_PASSWORD') }}"
    object_storage_access_key: "{{ lookup('env', 'HETZNER_OBJECT_STORAGE_ACCESS_KEY') }}"
    object_storage_secret_key: "{{ lookup('env', 'HETZNER_OBJECT_STORAGE_SECRET_KEY') }}"
    object_storage_location: "{{ lookup('env', 'HETZNER_OBJECT_STORAGE_LOCATION') | default('nbg1', true) }}"
    object_storage_bucket: "{{ lookup('env', 'HETZNER_OBJECT_STORAGE_BUCKET') }}"
    github_repository: "{{ lookup('env', 'MISE_CACHE_GITHUB_REPOSITORY') | default('jdx/mise', true) }}"
    github_owner_id: "{{ lookup('env', 'MISE_CACHE_GITHUB_OWNER_ID') | default('216188', true) }}"
    oidc_providers:
      - issuer: https://token.actions.githubusercontent.com
        audiences: ["https://{{ cache_domain }}"]
        rules:
          - claims:
              repository: "{{ github_repository }}"
              repository_owner_id: "{{ github_owner_id }}"
              ref: refs/heads/main
            read: ["{{ github_repository }}"]
            write: ["{{ github_repository }}"]
          - claims:
              repository: "{{ github_repository }}"
              repository_owner_id: "{{ github_owner_id }}"
              ref_type: tag
            read: ["{{ github_repository }}"]
            write: ["{{ github_repository }}"]
          - claims:
              repository: "{{ github_repository }}"
              repository_owner_id: "{{ github_owner_id }}"
              event_name: pull_request
            read: ["{{ github_repository }}"]
            write: []
          - claims:
              repository: "{{ github_repository }}"
              repository_owner_id: "{{ github_owner_id }}"
              event_name: push
            read: ["{{ github_repository }}"]
            write: []

  tasks:
    - name: Validate deployment inputs
      ansible.builtin.assert:
        that:
          - cache_domain | length > 0
          - cache_image | length > 0
          - database_password is match('^[A-Za-z0-9_-]{24,}$')
          - object_storage_access_key | length > 0
          - object_storage_secret_key | length > 0
          - object_storage_bucket | length > 0
        fail_msg: >-
          Set MISE_CACHE_DOMAIN, MISE_CACHE_IMAGE, MISE_CACHE_DATABASE_PASSWORD
          (at least 24 URL-safe characters), HETZNER_OBJECT_STORAGE_ACCESS_KEY,
          HETZNER_OBJECT_STORAGE_SECRET_KEY, and HETZNER_OBJECT_STORAGE_BUCKET.
      no_log: true

    - name: Install runtime packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - docker.io
          - docker-compose-v2
          - unattended-upgrades
        state: present
        update_cache: true

    - name: Enable Docker and unattended upgrades
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - docker
        - unattended-upgrades

    - name: Create deployment directory
      ansible.builtin.file:
        path: "{{ deploy_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Install Compose configuration
      ansible.builtin.template:
        src: compose.yaml.j2
        dest: "{{ deploy_dir }}/compose.yaml"
        owner: root
        group: root
        mode: "0644"
      notify: Restart mise-cache

    - name: Install Caddy configuration
      ansible.builtin.template:
        src: Caddyfile.j2
        dest: "{{ deploy_dir }}/Caddyfile"
        owner: root
        group: root
        mode: "0644"
      notify: Restart mise-cache

    - name: Install service environment
      ansible.builtin.template:
        src: env.j2
        dest: "{{ deploy_dir }}/.env"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      notify: Restart mise-cache

    - name: Install systemd unit
      ansible.builtin.template:
        src: mise-cache.service.j2
        dest: /etc/systemd/system/mise-cache.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Restart mise-cache

    - name: Flush configuration handlers
      ansible.builtin.meta: flush_handlers

    - name: Enable and start mise-cache
      ansible.builtin.systemd_service:
        name: mise-cache
        enabled: true
        state: started

    - name: Wait for the public health endpoint
      ansible.builtin.uri:
        url: "https://{{ cache_domain }}/v1/status"
        status_code: 200
      register: health
      retries: 20
      delay: 3
      until: health.status == 200

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Restart mise-cache
      ansible.builtin.systemd_service:
        name: mise-cache
        state: restarted
        enabled: true
        daemon_reload: true
