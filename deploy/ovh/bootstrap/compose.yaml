services:
  cache:
    image: "${MISE_CACHE_IMAGE:?MISE_CACHE_IMAGE is required}"
    restart: unless-stopped
    env_file: cache.env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - staging:/tmp
    networks: [internal]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mise_cache
      POSTGRES_USER: mise_cache
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mise_cache"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres:/var/lib/postgresql/data
    networks: [internal]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      MISE_CACHE_DOMAIN: "${MISE_CACHE_DOMAIN:?MISE_CACHE_DOMAIN is required}"
      CADDYFILE: |
        {$$MISE_CACHE_DOMAIN} {
            encode zstd gzip

            @metrics path /metrics
            respond @metrics 404

            reverse_proxy cache:8080 {
                health_uri /v1/status
            }
        }
    command:
      - sh
      - -ec
      - |
        printf '%s\n' "$$CADDYFILE" >/tmp/Caddyfile
        exec caddy run --config /tmp/Caddyfile --adapter caddyfile
    depends_on:
      - cache
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

networks:
  internal: {}

volumes:
  caddy_config: {}
  caddy_data: {}
  postgres: {}
  staging: {}
